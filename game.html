<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI公司大作战</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0d1220;
    --panel: #141b2d;
    --panel2: #1a2340;
    --line: #27334f;
    --text: #dbe6ff;
    --dim: #8ea3c9;
    --gold: #ffc861;
    --green: #59d98c;
    --red: #ff6b6b;
    --blue: #6aa9ff;
    --purple: #b48cff;
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: radial-gradient(1200px 700px at 50% -10%, #1d2b4d 0%, #0d1220 55%, #070b14 100%);
    color: var(--text);
    user-select: none;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  /* ---------- 顶部资源栏 ---------- */
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; flex: none;
    background: linear-gradient(180deg, rgba(24,34,58,.95), rgba(14,20,34,.85));
    border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 700; letter-spacing: .5px; color: #cfe0ff; }
  .brand small { font-weight: 400; color: var(--dim); margin-left: 6px; font-size: 11px; }
  #btnRestart {
    margin-left: 10px; padding: 4px 10px; font-size: 11.5px; border-radius: 8px;
    color: #9db3d6; border-color: #2c3b5c; opacity: .8;
  }
  #btnRestart:hover, #btnHelp:hover, #btnQuickSave:hover, #btnSave:hover { opacity: 1; }
  /* 右栏：人事中心入口 */
  .hrEntry {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 11px 12px; margin-bottom: 10px; border-radius: 12px; cursor: pointer;
    border: 1px solid #5a7fc4; color: #fff; text-align: left;
    background: linear-gradient(135deg, #3a6cc4 0%, #5a45b8 100%);
    box-shadow: 0 6px 18px rgba(58,108,196,.3);
    transition: transform .14s, box-shadow .14s;
  }
  .hrEntry:hover { transform: translateY(-1px); box-shadow: 0 9px 24px rgba(90,124,196,.45); }
  .hrEntry .hi-svg { width: 30px; height: 30px; flex: none; filter: drop-shadow(0 2px 4px rgba(0,0,0,.25)); }
  .hrEntry .hi-tx { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .hrEntry .hi-tx b { font-size: 13.5px; letter-spacing: .5px; }
  .hrEntry .hi-tx em { font-style: normal; font-size: 10px; color: #c9d9f5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hrEntry .hi-badge {
    margin-left: auto; flex: none; font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: rgba(255,255,255,.22);
  }
  .ovrow { display: flex; align-items: center; gap: 7px; font-size: 11px; color: #9fb6d8; margin-bottom: 6px; }
  .ovrow > span:first-child { width: 34px; flex: none; }
  .ovbar { flex: 1; height: 5px; background: #0e1424; border-radius: 99px; overflow: hidden; }
  .ovbar i { display: block; height: 100%; }
  .ovrow b { width: 34px; text-align: right; color: #e6f0ff; font-size: 11px; }

  .topbar .cta {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 15px; border-radius: 11px; cursor: pointer;
    border: 1px solid #5a7fc4; color: #fff;
    background: linear-gradient(135deg, #3a6cc4 0%, #5a45b8 100%);
    box-shadow: 0 0 0 0 rgba(90,124,196,.55), 0 6px 18px rgba(58,108,196,.32);
    animation: ctaPulse 2.6s ease-in-out infinite;
    transition: transform .15s, box-shadow .15s;
  }
  .topbar .cta:hover { transform: translateY(-1px) scale(1.02); box-shadow: 0 8px 24px rgba(90,124,196,.5); }
  .topbar .cta .cta-ic { font-size: 15px; }
  .topbar .cta .cta-tx { font-size: 13px; font-weight: 700; letter-spacing: .5px; }
  .topbar .cta .cta-badge {
    font-size: 10.5px; padding: 1px 7px; border-radius: 999px;
    background: rgba(255,255,255,.2); color: #eaf2ff;
  }
  @keyframes ctaPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(90,124,196,.5), 0 6px 18px rgba(58,108,196,.32); }
    50% { box-shadow: 0 0 0 6px rgba(90,124,196,0), 0 6px 22px rgba(58,108,196,.45); }
  }
  @media (max-width: 1120px) {
    .topbar .cta .cta-tx { display: none; }
    /* 右栏：人事中心入口 */

    background: linear-gradient(135deg, #3a6cc4 0%, #5a45b8 100%);

  }

 .hrEntry .hi-tx { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .hrEntry .hi-tx b { font-size: 13.5px; letter-spacing: .5px; }
  .hrEntry .hi-tx em { font-style: normal; font-size: 10px; color: #c9d9f5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hrEntry .hi-badge {
    margin-left: auto; flex: none; font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: rgba(255,255,255,.22);
  }

  .ovrow > span:first-child { width: 34px; flex: none; }

  .ovbar i { display: block; height: 100%; }

  .topbar .cta { padding: 7px 11px; }
  }

  #btnQuickSave {
    margin-left: 10px; padding: 4px 12px; font-size: 11.5px; border-radius: 8px;
    color: #b8e6c6; border-color: #2f6b47; background: linear-gradient(180deg, #1e3a2c, #152a20);
    opacity: .95;
  }
  #btnQuickSave.saved { color: #fff; background: #2f8f5b; border-color: #59d98c; }
  #btnSave {
    margin-left: 6px; padding: 4px 10px; font-size: 11.5px; border-radius: 8px;
    color: #9db3d6; border-color: #2c3b5c; opacity: .8;
  }
  #btnHelp {
    margin-left: 6px; padding: 4px 10px; font-size: 11.5px; border-radius: 8px;
    color: #9db3d6; border-color: #2c3b5c; opacity: .8;
  }
  .res { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .chip {
    display: flex; align-items: center; gap: 6px;
    background: var(--panel2); border: 1px solid var(--line);
    padding: 4px 10px; border-radius: 999px; font-size: 13px; white-space: nowrap;
  }
  .chip b { color: #fff; font-weight: 600; }
  .chip.day { border-color: #3b4d78; background: #1b2647; }
  .chip.cash b { color: var(--gold); }
  .chip.rep b { color: var(--green); }
  .chip.mor b { color: var(--blue); }
  .chip.inv b { color: var(--purple); }
  .chip.cmp b { color: #7de3ff; }

  /* ---------- 主体三栏 ---------- */
  main { flex: 1; display: grid; grid-template-columns: 300px 1fr 280px; min-height: 0; }

  .col { min-height: 0; min-width: 0; display: flex; flex-direction: column; }
  .col.left { border-right: 1px solid var(--line); background: rgba(16,22,38,.72); }
  .col.right { border-left: 1px solid var(--line); background: rgba(16,22,38,.72); }

  .colhead {
    flex: none; padding: 9px 12px; font-size: 12px; color: var(--dim);
    letter-spacing: .5px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
  }
  .scroll { overflow-y: auto; padding: 10px; flex: 1; }
  .scroll::-webkit-scrollbar { width: 8px; }
  .scroll::-webkit-scrollbar-thumb { background: #2b3a5c; border-radius: 8px; }

  /* ---------- 选中/派单提示条 ---------- */
  .selbar {
    display: none; align-items: center; gap: 10px;
    padding: 8px 12px; font-size: 12.5px;
    background: linear-gradient(180deg, rgba(40,55,90,.96), rgba(26,36,60,.96));
    border-bottom: 1px solid var(--line);
  }
  .selbar.on { display: flex; }
  .selbar .txt { color: #cfe0ff; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .selbar .txt b { color: var(--gold); }
  .selbar button { padding: 5px 13px; font-size: 12px; flex: none; }
  .selbar button.mini {
    padding: 0; width: 20px; height: 20px; line-height: 18px; border-radius: 50%;
    font-size: 11px; color: #8ea3c9; background: transparent; border: 1px solid #3a4d75;
  }
  .selbar button.mini:hover { color: #cfe0ff; border-color: #5a76a8; }
  .selbar button.undo {
    border-color: #7a5f24; color: var(--gold);
    background: linear-gradient(180deg, #4a3a18, #2e2410);
  }

  /* ---------- 订单卡 ---------- */
  .order {
    background: linear-gradient(180deg, #1b2440, #161d33);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 11px; margin-bottom: 9px; cursor: pointer;
    transition: transform .12s, border-color .12s, box-shadow .12s;
    position: relative; overflow: hidden;
  }
  .order:hover { transform: translateY(-2px); border-color: #46608f; }
  .order.sel { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(255,200,97,.25); }
  .order.busy { border-color: #3f6f9f; background: linear-gradient(180deg, #1c2942, #161d33); }
  .order .mini {
    float: right; padding: 2px 9px; font-size: 10.5px; border-radius: 6px;
    border: 1px solid #7a5f24; color: var(--gold);
    background: linear-gradient(180deg, #4a3a18, #2e2410);
  }
  .order .mini:hover { filter: brightness(1.3); }
  .order .row1 { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .tag {
    font-size: 11px; padding: 2px 7px; border-radius: 6px;
    background: #24314f; color: #9fc2ff; border: 1px solid #33456b;
  }
  .stars { color: var(--gold); font-size: 12px; letter-spacing: 1px; }
  .order .title { font-size: 13.5px; font-weight: 600; margin-bottom: 4px; }
  .order .meta { font-size: 11.5px; color: var(--dim); display: flex; gap: 10px; }
  .bar { height: 5px; background: #0e1424; border-radius: 99px; overflow: hidden; margin-top: 7px; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #4a86ff, #7de3ff); width: 0; transition: width .3s; }
  .dl { font-size: 11px; color: #ffb36b; }

  /* ---------- 办公室 ---------- */
  .office { flex: 1; min-height: 0; position: relative; overflow-y: auto; overflow-x: hidden; padding: 26px 12px 12px; }
  .floor {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px; align-content: start; align-items: start;
  }
  .desk {
    position: relative; border-radius: 14px; padding: 8px 9px 10px;
    background: linear-gradient(180deg, rgba(30,42,72,.9), rgba(20,28,48,.9));
    border: 1px solid var(--line); cursor: pointer;
    transition: transform .12s, border-color .12s, box-shadow .12s;
    overflow: visible;
  }
  .desk:hover { transform: translateY(-3px); border-color: #46608f; }
  .desk.sel { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(255,200,97,.22); }
  .desk.busy { border-color: #3f6f9f; }
  .desk .avatar {
    width: 68px; height: 68px; border-radius: 50%; object-fit: cover;
    display: block; margin: 0 auto 5px;
    border: 2px solid rgba(150,190,255,.35);
    background: #0e1424;
  }
  .desk .avatar.ph {
    display: flex; align-items: center; justify-content: center;
    border: 2px dashed rgba(140,165,205,.45);
    background: repeating-linear-gradient(45deg, #131a2b, #131a2b 6px, #161e31 6px, #161e31 12px);
    color: #6d7f9f; font-size: 22px; font-weight: 700; line-height: 1;
  }
  .desk .phnote { text-align: center; font-size: 9.5px; color: #6d7f9f; margin: -2px 0 3px; }
  .desk .fit.mid  { color: #ffc861; border-color: #6b5320; background: rgba(255,200,97,.12); }
  .desk .fit.bad  { color: #ff6b6b; border-color: #6b2f2f; background: rgba(255,107,107,.12); }
  .desk .nm { text-align: center; font-size: 12.5px; font-weight: 600; margin-bottom: 1px; }
  .desk .role { text-align: center; font-size: 10px; color: var(--dim); margin-bottom: 5px; }
  /* ---------- AI 旗下小组 ---------- */
  .desk .teamline {
    display: flex; justify-content: space-between;
    font-size: 10px; color: #7f93b8; margin: 6px 0 2px;
  }
  .desk .teamlist { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .wrow {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 6px; border-radius: 7px; cursor: pointer;
    background: #1a2340; border: 1px solid #2c3b5c;
    font-size: 10.5px; transition: .12s;
  }
  .wrow:hover { border-color: #46608f; filter: brightness(1.15); }
  .wrow .widx { width: 13px; flex: none; text-align: center; color: #7f93b8; }
  .wrow .wname {
    flex: none; max-width: 88px; color: #cfe0ff;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .wrow .wbar {
    flex: 1; min-width: 26px; height: 4px; border-radius: 99px;
    background: #0e1424; overflow: hidden;
  }
  .wrow .wbar i { display: block; height: 100%; background: linear-gradient(90deg, #59d98c, #b6ff8a); }
  .wrow .wstate {
    flex: none; max-width: 92px; font-size: 9.5px; color: #8ea3c9;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .wrow.busy { border-color: #7a5f24; background: #2e2410; }
  .wrow.busy .wbar i { background: linear-gradient(90deg, #ffc861, #ff9b4a); }
  .wrow.tired .wbar i { background: linear-gradient(90deg, #ff6b6b, #ffa14a); }
  .desk .team { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
  .slots { display: flex; flex-direction: column; gap: 8px; }
  .slot {
    display: flex; align-items: center; gap: 10px;
    background: #1a2340; border: 1px solid #2c3b5c;
    border-radius: 10px; padding: 9px 11px;
  }
  .slot .si { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .slot .si b { font-size: 12.5px; color: #e6f0ff; }
  .slot .si span { font-size: 11px; color: #8ea3c9; }
  .slot .sa { display: flex; gap: 5px; flex: none; }
  .slot .sa button { padding: 5px 10px; font-size: 11.5px; }
  .io { display: flex; gap: 8px; margin-top: 14px; }
  .io button { flex: 1; padding: 9px; font-size: 12.5px; }
  .panel-body .pickbtn {
    width: 100%; margin-bottom: 9px; padding: 8px;
    border-color: #3f6f9f; background: linear-gradient(180deg, #2f6fb8, #1d4576); color: #fff;
  }
  .rrow { display: flex; flex-direction: column; gap: 6px; }
  .rbtn {
    display: flex; align-items: center; gap: 8px; text-align: left;
    padding: 7px 9px; font-size: 11.5px;
  }
  .rbtn b { flex: none; width: 34px; }
  .rbtn span { color: #8ea3c9; font-size: 10.5px; }
  .rbtn span:last-child { margin-left: auto; }
  .rbtn.locked { opacity: .45; }
  .rbtn.cant { opacity: .7; }
  .autoPickBtn {
    width: 100%; margin-bottom: 5px; padding: 6px;
    font-size: 10.5px; border-radius: 7px;
    border-color: #3f6f9f; background: linear-gradient(180deg, #2f6fb8, #1d4576); color: #fff;
  }
  .wrow.rest { border-color: #6b2f2f; background: #2b1a1a; }
  .wrow.rest .wstate { color: #ff9b9b; }
  .wrow .wsmark { flex: none; font-size: 9px; color: #b48cff; }
  .wrow.lead { border-color: #5a4a8a; background: #221a3a; }
  .wrow.lead .wname em { font-style: normal; font-size: 9px; color: #b48cff; }
  .wrow.lead .wbar i { background: linear-gradient(90deg, #b48cff, #7bd0ff); }
  .wrow.lead.busy { border-color: #8a6b2f; background: #2e2410; }
  .pickbtn.leadbtn {
    border-color: #6b4a9f;
    background: linear-gradient(180deg, #4a2f7a, #2e1e4d);
    margin-top: -3px;
  }


  .srowwrap { margin-bottom: 6px; }
  .sskills { display: flex; gap: 5px; flex-wrap: wrap; padding: 4px 0 0 22px; }
  .skchip {
    font-size: 9.5px; color: #8ea3c9; background: #16223c;
    border: 1px solid #26314d; border-radius: 5px; padding: 1px 6px;
  }
  .skchip b { color: #cfe0ff; margin-left: 3px; }
  .wrow .wsell {
    flex: none; width: 15px; height: 15px; line-height: 13px; text-align: center;
    border-radius: 4px; color: #7f93b8; font-size: 12px;
  }
  .wrow .wsell:hover { color: #ff6b6b; background: #3a2030; }
  .wchip {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 4px 5px 5px; border-radius: 8px; cursor: pointer;
    background: #1a2340; border: 1px solid #2c3b5c; transition: .12s;
  }
  .wchip b { font-size: 11px; color: #cfe0ff; line-height: 1; }
  .wchip .wbar {
    display: block; width: 24px; height: 3px; border-radius: 99px;
    background: #0e1424; overflow: hidden;
  }
  .wchip .wbar i { display: block; height: 100%; background: linear-gradient(90deg, #59d98c, #b6ff8a); }
  .wchip:hover { border-color: #46608f; filter: brightness(1.18); }
  .wchip.busy { border-color: #7a5f24; background: #2e2410; }
  .wchip.busy .wbar i { background: linear-gradient(90deg, #ffc861, #ff9b4a); }
  .wchip.tired .wbar i { background: linear-gradient(90deg, #ff6b6b, #ffa14a); }
  .mrow { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--dim); margin-bottom: 3px; }
  .mrow .b { flex: 1; height: 5px; background: #0e1424; border-radius: 99px; overflow: hidden; }
  .mrow .b > i { display: block; height: 100%; transition: width .3s; }
  .mood > i { background: linear-gradient(90deg, #59d98c, #b6ff8a); }
  .fatigue > i { background: linear-gradient(90deg, #ffa14a, #ff6b6b); }
  .trust > i { background: linear-gradient(90deg, #6aa9ff, #b48cff); }
  .bubble {
    position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    background: #fff; color: #22303f; font-size: 11.5px; padding: 5px 10px;
    border-radius: 10px; box-shadow: 0 6px 16px rgba(0,0,0,.45);
    width: max-content; max-width: 190px; white-space: normal; text-align: center;
    opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 20;
  }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%);
    border: 5px solid transparent; border-top-color: #fff; border-bottom: 0;
  }
  .bubble.on { opacity: 1; }
  .task {
    margin-top: 7px; font-size: 11px; color: #9fc2ff; text-align: center;
    background: #16223c; border-radius: 7px; padding: 3px 6px;
    border: 1px solid #2a3b5e; min-height: 20px;
  }
  .rest { margin-top: 7px; font-size: 11px; color: #8ea3c9; text-align: center; }

  /* ---------- 右侧面板 ---------- */
  .panel-body { padding: 12px; overflow-y: auto; flex: 1; min-height: 0; }
  .pcard { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .pcard h3 { margin: 0 0 8px; font-size: 13px; color: #cfe0ff; }
  .skill { display: flex; align-items: center; gap: 6px; font-size: 11.5px; margin-bottom: 4px; color: var(--dim); }
  .skill .b { flex: 1; height: 6px; background: #0e1424; border-radius: 99px; overflow: hidden; }
  .skill .b > i { display: block; height: 100%; background: linear-gradient(90deg, #4a86ff, #7de3ff); }
  .btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  button {
    font: inherit; font-size: 12px; color: #eaf3ff; cursor: pointer;
    padding: 8px 6px; border-radius: 9px; border: 1px solid #33456b;
    background: linear-gradient(180deg, #2a3a5e, #1d2942);
    transition: filter .12s, transform .1s;
  }
  button:hover { filter: brightness(1.2); }
  button:active { transform: scale(.96); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.gold { border-color: #7a5f24; background: linear-gradient(180deg, #4a3a18, #2e2410); color: var(--gold); }

  /* ---------- 底部 ---------- */
  footer {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: 9px 14px; border-top: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(14,20,34,.9), rgba(10,14,24,.95));
  }
  .logbox {
    flex: 1; height: 34px; overflow: hidden; position: relative;
    font-size: 12px; color: var(--dim);
  }
  .logbox div { line-height: 17px; }
  .logbox .new { color: #ffe1a8; }
  .bigbtn {

  /* ---------- 弹窗 ---------- */

  /* ---------- 日结转场 ---------- */

  /* ---------- 浮动提示 ---------- */
  .toast-wrap {

  }

  @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(-6px); } }

  /* ---------- 交互式指引 ---------- */
  .guide { display: none; }
  .guide.on { display: block; }
  .gspot {
    position: fixed; border-radius: 10px; border: 2px solid var(--gold);
    box-shadow: 0 0 0 9999px rgba(4,7,13,.66), 0 0 24px rgba(255,200,97,.45);
    pointer-events: none; z-index: 96; transition: left .25s, top .25s, width .25s, height .25s;
  }
  .gtip {
    position: fixed; z-index: 97; width: 300px;

  .gtip .step { font-size: 10.5px; color: #7f93b8; margin-bottom: 5px; letter-spacing: 1px; }
  .gtip .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 11px; }

  }


  /* ---------- 人事中心：招聘内容 ---------- */
  .rp-sec { font-size: 12px; color: #7f93b8; margin: 14px 0 9px; letter-spacing: .5px; }
  .rp-tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .rtier {

  .rp-depts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; }
  .rdept {

    padding: 10px 6px; text-align: center; cursor: pointer; transition: .15s;

  @media (max-width: 820px) {
    .rp-tiers { grid-template-columns: 1fr; }
    .rp-depts { grid-template-columns: repeat(3, 1fr); }
  }
  /* ---------- 双页面 + 滑动转场 ---------- */
  .stage { position: fixed; inset: 0; overflow: hidden; }
  .view {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    transition: transform .42s cubic-bezier(.22,.61,.36,1), opacity .30s ease;

  #app { background: radial-gradient(1200px 700px at 50% -10%, #1d2b4d 0%, #0d1220 55%, #070b14 100%); }
  #viewHR {
    transform: translateX(100%); opacity: 0; pointer-events: none;

  #viewBag {
    transform: translateX(100%); opacity: 0; pointer-events: none;

  #viewHistory {
    transform: translateX(100%); opacity: 0; pointer-events: none;
    background: radial-gradient(1000px 700px at 50% 0%, #1a2740 0%, #0b1019 60%, #06090f 100%);
  }

  body.hist-mode #viewHistory { transform: translateX(0); opacity: 1; pointer-events: auto; }
  .hcard {
    background: #18213a; border: 1px solid #2c3b5c; border-radius: 10px;
    padding: 10px 14px; margin-bottom: 9px;

  .hcard h4 { margin: 0 0 6px; font-size: 13px; color: #cfe0ff; display: flex; justify-content: space-between; }
  .hcard h4 em { font-style: normal; font-size: 11px; color: #8ea3c9; font-weight: 400; }
  .hline { font-size: 11.5px; color: #9fb3d4; line-height: 1.75; }
  .hline .up { color: #59d98c; }
  .hline .down { color: #ff9b9b; }
  .hstats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: #8ea3c9; margin-top: 6px; }
  .hstats b { color: #cfe0ff; }
  body.bag-mode #app { transform: translateX(-16%) scale(.96); opacity: 0; pointer-events: none; }
  body.bag-mode #viewBag { transform: translateX(0); opacity: 1; pointer-events: auto; }

  /* 管理中心页面 */
  .hr-head {
    display: flex; align-items: center; gap: 14px; flex: none;

    background: linear-gradient(180deg, rgba(24,34,58,.95), rgba(14,20,34,.85));
  }
  .hr-head h1 { margin: 0; font-size: 16px; color: #eaf2ff; letter-spacing: 1px; }

  .hr-tab {
    padding: 7px 16px; font-size: 12.5px; border-radius: 9px 9px 0 0;

  /* 人员列表 */
  .scard { background: #161e31; border: 1px solid #2c3b5c; border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
  .scard-h { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }

  .scard-h b { font-size: 13px; color: #e6f0ff; }

  .srow .sstate { width: 108px; color: #8ea3c9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .srow .sprice { color: var(--gold); width: 56px; text-align: right; }
  .srow .sbtn { padding: 3px 9px; font-size: 10.5px; border-radius: 6px; }

  /* 商店 / 背包 */
  .ovnote { font-size: 10.5px; color: #8ea3c9; margin: 2px 0 6px; line-height: 1.6; }
  .pcard.todo { border-color: #3a5680; background: linear-gradient(180deg, #1a2a4a, #16203a); }
  .todoline { display: flex; gap: 8px; align-items: center; font-size: 12px; color: #bcd0ee; padding: 3px 0; }
  .todoline span { flex: none; width: 16px; text-align: center; color: #ffc861; }

    display: flex; align-items: center; gap: 11px;

  .ic-main { flex: 1; min-width: 0; }

  .ic-n { color: #8ea3c9; font-weight: 400; font-size: 11px; }
  .ic-desc { font-size: 10.5px; color: #8ea3c9; margin-top: 2px; line-height: 1.5; }

  .bag-empty { color: #7f93b8; font-size: 12px; text-align: center; padding: 30px 0; }
  .picklist { display: flex; flex-direction: column; gap: 6px; max-height: 46vh; overflow: auto; }
  .pickrow {
    display: flex; justify-content: space-between; align-items: center;

  }
  .pickrow:hover { border-color: #4a63a0; background: #1d2946; }

  .srow .sbtn.coffee { border-color: #6b5320; color: #ffc861; background: #2e2410; padding: 3px 7px; }
  .sempty { font-size: 11px; color: #6d7f9f; padding: 6px 2px; }

  /* ---------- 屏幕正下方的效果说明 ---------- */
  .acttip {
    position: fixed; left: 50%; bottom: 58px; transform: translateX(-50%) translateY(6px);
    z-index: 88; pointer-events: none;
    max-width: min(680px, 92vw);
    padding: 9px 18px; border-radius: 12px;
    background: rgba(20,28,46,.96); border: 1px solid #3a4d75;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
    font-size: 12.5px; line-height: 1.7; color: #c2d4ee; text-align: center;
    opacity: 0; transition: opacity .16s, transform .16s;
  }
  .acttip.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  .acttip b { color: #fff; }
  .acttip em { font-style: normal; color: #8ea3c9; }

  /* ---------- 资源悬停说明 ---------- */
  .chip { cursor: help; }

    position: fixed; z-index: 95; max-width: 290px;

    color: #c2d4ee; box-shadow: 0 14px 38px rgba(0,0,0,.55);

    left: 0; top: 0;
  }
  .tip.on { opacity: 1; }
  .tip .t { font-size: 13px; font-weight: 700; color: #eaf2ff; margin-bottom: 5px; }
  .tip b { color: #fff; }
  .tip .k { color: var(--gold); }
  .tip .row { margin-top: 7px; padding-top: 7px; border-top: 1px solid #27334f; color: #9fb6d8; }

  /* ---------- 新手引导 ---------- */
  .intro {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;

  }</style>

<body>
<div class="stage">
<div class="view" id="app">

  <div class="topbar">
    <div class="brand">AI公司大作战 <small>横版经营 · 心情驱动</small></div>

    <button id="btnRestart" title="清空进度，随机开一局新的">↻ 重开新局</button>
    <button id="btnHelp" title="再看一遍玩法说明">? 玩法</button>
    <button id="btnQuickSave" title="点一下立刻保存">💾 保存</button>
    <button id="btnSave" title="存档位 / 导出 / 导入">📂 存档管理</button>
    
    <div class="res">
      <div class="chip day" data-tip="day">第 <b id="rDay">1</b> 天</div>
      <div class="chip cash" data-tip="cash">💰 <b id="rCash">0</b></div>

/* =========================================================
   工具
   ========================================================= */
const clamp = (v, lo = 0, hi = 100) => Math.max(lo, Math.min(hi, v));
const pick = a => a[(Math.random() * a.length) | 0];
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const $ = id => document.getElementById(id);

/* =========================================================
   游戏状态
   ========================================================= */
let G = null;
let selOrder = null;
let selStaff = null;
let selWorker = null;

function newGame() {
  G = {
    day: 1,
    cash: CFG.startCash,
    compute: CFG.startCompute,
    reputation: 50,
    morale: 60,
    investor: 50,
    orders: [],
    logs: [],
    finished: false,
    lastAssign: null,
    peakCash: CFG.startCash,
    staff: CFG.staff.map(s => ({
      ...s,
      mood: (s.start ? s.start.mood : 70) + rnd(-6, 6),
      fatigue: (s.start ? s.start.fatigue : 15) + rnd(-4, 6),
      trust: (s.start ? s.start.trust : 55) + rnd(-5, 5),
      level: 1,
      working: null,
      resting: false,
      talkCd: 0, raiseCd: 0,
      streak: 0,
      bubble: "", bubbleT: 0,
    })),
    workers: [],
    bag: [],
    bought: {},
    usedToday: 0,
    history: [],
  };
  // 按配置生成各 AI 旗下的员工
  for (const ai of CFG.staff) {
    const size = (CFG.teams[ai.id] || {}).size || 1;
    for (let i = 1; i <= size; i++) {
      const sk = {};
      const best = Object.keys(ai.skills).sort((a, b) => ai.skills[b] - ai.skills[a])[0];
      Object.keys(ai.skills).forEach(k => {
        let v = rnd(0, 3);                      // 0~3，拉开差距
        if (k === best) v = Math.max(v, 2);     // 专精项至少 2
        sk[k] = Math.min(3, v);
      });
      G.workers.push({
        id: ai.id + "-" + i,
        aiId: ai.id,
        name: ai.name + "·" + i,
        skills: sk,
        stamina: rnd(30, 49),   // 开局体力都在 50 以下
        busy: null,
        wage: CFG.workerWage,
      });
    }
  }
  selOrder = null; selStaff = null;
  for (let i = 0; i < ordersPerDay(G.day); i++) spawnOrder();
  log("公司开张，第 1 天。");
  save();
  renderAll();
}

/* =========================================================
   订单
   ========================================================= */
let oid = 0;
/* 按天数解锁订单类型：循序渐进，别一上来就 5 种类型糊脸 */
function unlockedTypes(day) {
  const t = ["copy", "cs"];
  if (day >= 4) t.push("dev");
  if (day >= 7) t.push("data");
  if (day >= 10) t.push("idea");
  return t;
}

function starCap(day) {
  if (day >= 11) return 3;
  if (day >= 5) return 2;
  return 1;
}

function ordersPerDay(day) {
  if (day <= 2) return 2;
  if (day <= 4) return 3;
  return CFG.orderPerDay + 1;
}

function spawnOrder() {
  const types = unlockedTypes(G.day);
  const t = pick(types);
  const stars = rnd(1, starCap(G.day));
  const names = {
    copy: ["品牌文案重写", "公众号长文", "产品说明书"],
    dev:  ["API 接入", "推荐算法调优", "后端重构"],
    data: ["用户画像分析", "月度数据报表", "AB 测试复盘"],
    idea: ["新品创意提案", "广告脚本", "活动策划"],
    cs:   ["大客户陪跑", "工单批量回复", "售后回访"],
  };
  let need = stars * 13;
  G.orders.push({
    id: ++oid,
    type: t,
    stars,
    title: pick(names[t]),
    need,
    progress: 0,
    daysLeft: rnd(2, 4) + stars,
    reward: Math.round(stars * 800 + rnd(0, 250)),
    penalty: stars * 320,
    computeCost: stars * 6,
    crew: [],
    client: pick(CFG.clients),
    mod: null,
    modName: "",
    modColor: "",
    minCrew: 1,
    assignedTo: null,
  });

  // 挂一个随机修饰
  const o = G.orders[G.orders.length - 1];
  const pool = CFG.mods.filter(m => !m.minDay || G.day >= m.minDay);
  if (pool.length && Math.random() < 0.8) {
    const mod = pick(pool);
    o.mod = mod.id;
    o.modName = mod.name;
    o.modColor = mod.color;
    if (mod.starAdd) {
      o.stars = Math.min(starCap(G.day) + 1, o.stars + mod.starAdd);
      o.need = o.stars * 13;
      o.reward = Math.round(o.stars * 800 + rnd(0, 250));
    }
    if (mod.ddl) o.daysLeft = Math.max(2, o.daysLeft + mod.ddl);
    if (mod.mulReward) o.reward = Math.round(o.reward * mod.mulReward);
    if (mod.mulNeed) o.need = Math.round(o.need * mod.mulNeed);
    if (mod.minCrew) o.minCrew = mod.minCrew;
    o.penalty = Math.round(o.reward * 0.35);
  }
}

/* 撤回某一单（点订单卡上的「↩ 撤回」） */
function undoOrder(orderId) {
  const o = G.orders.find(x => x.id === orderId);
  if (!o) return;
  if (!o.crew.length && !o.assignedTo) return;
  const n = o.crew.length;
  o.crew.forEach(wid => {
    if (typeof wid === "string" && wid.indexOf("ai:") === 0) {
      const ai = G.staff.find(s => s.id === wid.slice(3));
      if (ai) ai.working = null;
      G.compute += 3;
      G.usedToday = Math.max(0, (G.usedToday || 0) - 3);
      return;
    }
    const w = G.workers.find(x => x.id === wid);
    if (w) { w.busy = null; G.compute += CFG.workerCompute; }
  });
  const ai = G.staff.find(s => s.id === o.assignedTo);
  if (ai) {
    if (typeof o.moodDelta === "number") ai.mood = clamp(ai.mood - o.moodDelta);
    bubble(ai, "那先撤下来");
  }
  o.crew = [];
  o.assignedTo = null;
  o.moodDelta = 0;
  if (G.lastAssign && G.lastAssign.orderId === orderId) G.lastAssign = null;
  toast(`已撤回派单，${n} 人回到空闲，算力已返还`, "");
  log(`↩ 撤回「${o.title}」的派单`);
  save();
  renderAll();
}

/* =========================================================
   派单 / 管理
   ========================================================= */
function pickWorker(workerId) {
  const w = G.workers.find(x => x.id === workerId);
  if (!w) return;
  if (w.mustRest) { toast(`${w.name} 体力见底，明天得休息`, "warn"); return; }
  if (!selOrder) {
    toast(`先点一张订单，再点 ${w.name} 派活`, "warn");
    selStaff = w.aiId;
    renderAll();
    return;
  }
  const o = G.orders.find(x => x.id === selOrder);
  if (!o) return;

  // 已在别的单上
  if (w.busy && w.busy !== o.id) {
    toast(`${w.name} 正在做别的单，先撤回那张`, "warn");
    return;
  }
  // 从这单撤下
  if (w.busy === o.id) {
    w.busy = null;
    o.crew = o.crew.filter(id => id !== workerId);
    G.compute += CFG.workerCompute;
    G.usedToday = Math.max(0, (G.usedToday || 0) - CFG.workerCompute);
    if (!o.crew.length) o.assignedTo = null;
    log(`${w.name} 从「${o.title}」撤下`);
    selWorker = w.id;   // 右侧同步显示这名员工
    renderAll();
    return;
  }
  // 加入这单
  if (G.compute < CFG.workerCompute) {
    toast(`算力不足：派一人要 ${CFG.workerCompute}，当前只有 ${G.compute}`, "bad");
    return;
  }
  G.compute -= CFG.workerCompute;
  G.usedToday = (G.usedToday || 0) + CFG.workerCompute;
  w.busy = o.id;
  o.crew.push(workerId);
  o.assignedTo = w.aiId;
  selStaff = w.aiId;
  selWorker = w.id;   // 右侧同步显示这名员工
  log(`${w.name} 加入「${o.title}」（共 ${o.crew.length} 人）`);
  renderAll();
}
/* 点 AI 卡 = 让这位主管自己挑人上阵 */
/* 给某个下属买咖啡回体力 */
function coffeeWorker(wid) {
  const w = G.workers.find(x => x.id === wid);
  if (!w) return;
  if (w.stamina >= 100) { toast(`${w.name} 体力已经满了`, "warn"); return; }
  if (G.cash < CFG.coffeeCost) {
    toast(`资金不足：咖啡要 ¥${CFG.coffeeCost}，当前 ¥${Math.round(G.cash)}，还差 ¥${Math.round(CFG.coffeeCost - G.cash)}`, "bad");
    return;
  }
  G.cash -= CFG.coffeeCost;
  w.stamina = clamp(w.stamina + CFG.coffeeRecover);
  toast(`${w.name} 喝了咖啡，体力 +${CFG.coffeeRecover}`, "");
  save();
  renderAll();
  renderHR();
}

/* 在同一部门里切换到上一个/下一个员工 */
function stepWorker(wid, dir) {
  const w = G.workers.find(x => x.id === wid);
  if (!w) return;
  const team = G.workers.filter(x => x.aiId === w.aiId);
  let i = team.findIndex(x => x.id === wid);
  i = (i + dir + team.length) % team.length;
  selWorker = team[i].id;
  selStaff = w.aiId;
  renderAll();
}

/* 点员工：有订单就派活，没订单就看详情 */
function clickWorker(wid) {
  if (selOrder) { pickWorker(wid); return; }
  selWorker = (selWorker === wid) ? null : wid;
  const w = G.workers.find(x => x.id === selWorker);
  if (w) selStaff = w.aiId;   // 展开该员工所属的 AI 卡，方便接着点别人
  renderAll();
}

/* 点 ★ 主管行 = 查看主管详情（不派活，避免误操作） */
function clickLead(aiId) {
  selStaff = aiId;
  selWorker = null;
  renderAll();
}

/* 主管本人下场做当前选中的订单 */
function pickLead(aiId) {
  const s = G.staff.find(x => x.id === aiId);
  if (!s) return;
  if (!selOrder) { toast("先点一张订单，再让主管上", "warn"); return; }
  const o = G.orders.find(x => x.id === selOrder);
  if (!o) return;
  const key = "ai:" + aiId;
  const onboard = o.crew.indexOf(key) >= 0;

  if (onboard) {
    o.crew = o.crew.filter(x => x !== key);
    G.compute += 3;
    s.working = null;
    toast(`${s.name} 从「${o.title}」撤下`, "");
    renderAll();
    return;
  }
  if (s.resting) { toast(`${s.name} 正在休息`, "warn"); return; }
  if (s.working) { toast(`${s.name} 已经在做别的单了`, "warn"); return; }
  if (G.compute < 3) { toast(`算力不足：主管上阵要 3，当前 ${G.compute}`, "bad"); return; }

  G.compute -= 3;
  G.usedToday = (G.usedToday || 0) + 3;
  o.crew.push(key);
  o.assignedTo = o.assignedTo || aiId;
  s.working = { orderId: o.id };
  selStaff = aiId;
  log(`🧠 ${s.name} 亲自接下「${o.title}」`);
  toast(`${s.name} 亲自上：这单进度更快，但会烧自己的精力`, "");
  renderAll();
}

function assign(orderId, staffId) {
  const o = G.orders.find(x => x.id === orderId);
  const ai = G.staff.find(x => x.id === staffId);
  if (!o || !ai) return;

  if (ai.resting) {
    showConfirm(
      `${ai.name} 整个组在休息`,
      `要取消休息，让 ${ai.name} 挑人接下「${o.title}」吗？`,
      () => { ai.resting = false; assign(orderId, staffId); },
      "取消休息并派活"
    );
    return;
  }

  const free = G.workers.filter(w => w.aiId === staffId && !w.busy && !w.mustRest);
  if (!free.length) {
    toast(`${ai.name} 手下的人全在忙，先等结算`, "warn");
    return;
  }

  const need = Math.max(1, o.stars, o.minCrew || 1);   // 这单要几个人
  const have = o.crew.length;
  const short = need - have;
  if (short <= 0) {
    toast(`「${o.title}」已经排了 ${have} 人，够用了`, "warn");
    return;
  }

  const afford = Math.floor(G.compute / CFG.workerCompute);
  if (afford <= 0) {
    toast(`算力不足：派一人要 ${CFG.workerCompute}，当前只有 ${G.compute}`, "bad");
    return;
  }

  // 主管按「这单类型的技能 + 体力」挑人
  const picked = free
    .slice()
    .sort((a, b) => (b.skills[o.type] * 100 + b.stamina) - (a.skills[o.type] * 100 + a.stamina))
    .slice(0, Math.min(short, afford, free.length));

  const cost = picked.length * CFG.workerCompute;
  G.compute -= cost;
  G.usedToday = (G.usedToday || 0) + cost;
  picked.forEach(w => { w.busy = o.id; o.crew.push(w.id); });
  o.assignedTo = o.assignedTo || staffId;
  selOrder = null;
  selStaff = staffId;

  const match = ai.skills[o.type];
  let moodDelta = 0;
  if (match >= 4) { ai.mood = clamp(ai.mood + 5); moodDelta = 5; }
  else if (match <= 2) { ai.mood = clamp(ai.mood - 6); moodDelta = -6; }
  o.moodDelta = (o.moodDelta || 0) + moodDelta;

  const names = picked.map(w => w.name.split("·")[1]).join("、");
  bubble(ai, picked.length > 1 ? `我挑 ${picked.length} 个人上` : `这个人够了`);
  log(`${ai.name} 挑了 ${picked.length} 人（${names}）接下「${o.title}」`);
  toast(`${ai.name} 挑了 ${picked.length} 人：${names}`, "");
  renderAll();
  guideAdvance("orderAssigned");
}

function doCoffee(id) {
  const s = G.staff.find(x => x.id === id); if (!s) return;
  if (G.cash < CFG.coffeeCost) {
    toast(`资金不足：咖啡要 ¥${CFG.coffeeCost}，当前只有 ¥${Math.round(G.cash)}，还差 ¥${Math.round(CFG.coffeeCost - G.cash)}`, "bad");
    return;
  }
  G.cash -= CFG.coffeeCost;
  s.fatigue = clamp(s.fatigue - 30);                        // 立刻回精力
  s.mood = clamp(s.mood - 4);                               // 苦，心情掉
  s.coffeeDebt = (s.coffeeDebt || 0) + CFG.coffeeBacklash;  // 次日反弹：加疲劳
  bubble(s, pick(["……又是咖啡。", "苦。", "纯靠这个续命。", "心跳好快。"]));
  log(`${s.name} 喝了咖啡：精力 +30、心情 -4，明天疲劳 +${CFG.coffeeBacklash}`);
  save(); renderAll();
}
function doRest(id) {
  const s = G.staff.find(x => x.id === id); if (!s) return;
  if (s.resting) { toast(`${s.name} 已经在休息了`, "warn"); return; }
  if (s.working) { toast(`${s.name} 手上有活，今天没法休息`, "warn"); return; }
  s.resting = true;
  bubble(s, "那我先睡会儿");
  log(`${s.name} 今天休息（结算时恢复）`);
  toast(`${s.name} 进入休息状态，点右侧「取消休息」可以撤回`, "warn");
  save(); renderAll();
}
function cancelRest(id) {
  const s = G.staff.find(x => x.id === id); if (!s) return;
  s.resting = false;
  bubble(s, "那我不睡了？");
  toast(`已取消 ${s.name} 的休息`, "");

}
function doTalk(id) {
  const s = G.staff.find(x => x.id === id); if (!s) return;

function doRaise(id) {

  if (G.cash < 600) { toast(`资金不足：加薪要 ¥600，当前只有 ¥${G.cash}，还差 ¥${600 - G.cash}`, "bad"); return; }

function bubble(s, text) { s.bubble = text; s.bubbleT = 1; setTimeout(() => { s.bubbleT = 0; renderOffice(); }, 2200); }
function log(text) {
  G.logs.unshift({ d: G.day, text });
  if (G.logs.length > 40) G.logs.pop();
  const box = $("log");
  box.innerHTML = G.logs.slice(0, 2).map((l, i) => `<div class="${i === 0 ? "new" : ""}">D${l.d} · ${l.text}</div>`).join("");
}

/* ---------- 浮动提示 ---------- */
function toast(msg, kind) {
  const wrap = $("toasts");
  if (!wrap) return;
  // 同一句话短时间内不重复堆叠
  const kids = wrap.children;
  if (kids && kids.length) {
    const last = kids[kids.length - 1];
    if (last && last.textContent === msg) return;
  }
  const t = document.createElement("div");
  t.className = "toast" + (kind ? " " + kind : "");
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 280); }, 2200);
}

/* ---------- 确认弹窗 ---------- */
function showConfirm(title, html, onOk, okLabel) {
  showModal(title, html, [
    { label: "取消", fn: null },
    { label: okLabel || "确定", fn: onOk },
  ]);
}

let dayFxTimer = null;
function showDayTransition(day, items) {
  const box = $("dayfx");
  if (!box) return;
  const d = box.querySelector(".dayfx-day");
  const l = box.querySelector(".dayfx-list");
  if (d) d.innerHTML = "第 <b>" + day + "</b> 天";

  dayFxTimer = setTimeout(() => box.classList.remove("on"), 1500);
}

/* =========================================================
   一天结算
   ========================================================= */
function moodMult(m) {
  const d = (m - 75) / 55;
  return Math.max(0.35, 1.2 - 0.65 * d * d);
}
function energyMult(f) { return 0.55 + 0.45 * (1 - f / 100); }

function endDay() {
  if (G.finished) return;
  const deltas = [];
  const workedIds = new Set();
  const workedLeads = new Set();

  // 0. 算力超载：先算出加成与费用
  const ov = overloadInfo();

  // 1. 项目推进（按参与人数累加）
  const doneIds = [];
  G.orders.forEach(o => {
    if (!o.crew.length) return;
    let gain = 0;
    o.crew.forEach(wid => {
      // 主管本人
      if (typeof wid === "string" && wid.indexOf("ai:") === 0) {
        const ai = G.staff.find(s => s.id === wid.slice(3));
        if (!ai) return;
        const lv = ai.skills[o.type] || 1;
        const eff = (lv * 8 + 6) * moodMult(ai.mood) * energyMult(ai.fatigue);
        gain += eff;
        const streak = ai.streak || 0;
        const cost = Math.min(CFG.leadFatigueMax, CFG.leadFatigueBase + streak * CFG.leadFatigueStep);
        ai.fatigue = clamp(ai.fatigue + cost);
        // 心情看这单对不对口
        if (lv >= 4) {
          ai.mood = clamp(ai.mood + 3);   // 擅长：有成就感
          bubble(ai, pick(["这活我喜欢。", "拿手活。", "正合我意。"]));
        } else if (lv <= 2) {
          ai.mood = clamp(ai.mood - 4);   // 不对口：煎熬
          bubble(ai, pick(["……这个我不熟。", "又要熬。", "不太对口啊。"]));
        } else {
          ai.mood = clamp(ai.mood - 2);
        }
        ai.streak = streak + 1;
        workedLeads.add(ai.id);
        return;

      }
      const w = G.workers.find(x => x.id === wid);
      if (!w) return;
      const ai = G.staff.find(s => s.id === w.aiId);
      const lv = w.skills[o.type] || 1;
      const eff = (lv * 5 + 3) * moodMult(ai.mood) * (0.55 + 0.45 * (w.stamina / 100));
      gain += eff;
      w.stamina = clamp(w.stamina - 14);
      workedIds.add(w.id);
    });
    o.progress += gain * (1 + ov.bonus);
    if (o.progress >= o.need) doneIds.push(o.id);
  });

  // 2. 交付
  doneIds.forEach(id => {
    const o = G.orders.find(x => x.id === id);
    if (!o) return;
    G.cash += o.reward;
    G.reputation = clamp(G.reputation + 4);
    G.investor = clamp(G.investor + 2);
    o.crew.forEach(wid => {
      if (typeof wid === "string" && wid.indexOf("ai:") === 0) {
        const ai = G.staff.find(s => s.id === wid.slice(3));
        if (ai) ai.working = null;
        return;
      }
      const w = G.workers.find(x => x.id === wid);
      if (w) { w.busy = null; w.stamina = clamp(w.stamina + 4); }
    });
    // 参与的每个组都记功（可能不止一个组）
    crewGroups(o).forEach(gid => {
      const ai = G.staff.find(s => s.id === gid);
      if (!ai) return;
      ai.mood = clamp(ai.mood + 8);
      ai.trust = clamp(ai.trust + 4);
      ai.level = Math.min(3, ai.level + (Math.random() < 0.25 ? 1 : 0));
      bubble(ai, pick(["交付了！", "这单拿下。", "客户挺满意。"]));
    });
    log(`✅ ${o.title} 交付（${o.crew.length} 人），+¥${o.reward}`);
    deltas.push(`✅ <b>${o.title}</b> 交付 <span style="color:#59d98c">+¥${o.reward}</span>`);
    G.orders = G.orders.filter(x => x.id !== id);
  });

  // 3. 空闲的人恢复体力
  G.workers.forEach(w => {
    if (w.mustRest) {
      // 强制休息：满血复活
      w.stamina = clamp(w.stamina + CFG.forceRestRecover);
      w.mustRest = false;
      w.busy = null;
    } else if (!w.busy && !workedIds.has(w.id)) {
      w.stamina = clamp(w.stamina + CFG.idleRecover);   // 完全空闲：充分恢复
    } else if (workedIds.has(w.id)) {
      w.stamina = clamp(w.stamina + CFG.workRecover);   // 干过活：也能回一点
    }
    // 累到红线以下 → 明天必须休息
    if (w.stamina < CFG.exhaustLine) {
      w.mustRest = true;
      deltas.push(`😵 ${w.name} 体力见底，明天强制休息`);
    }
  });

  // 4. AI 的状态
  G.staff.forEach(s => {
    // 休息中的 AI：结算时恢复，跳过当天的常规漂移
    if (s.resting) {
      s.fatigue = clamp(s.fatigue - 35);
      s.mood = clamp(s.mood + 8);
      s.trust = clamp(s.trust + 2);
      s.resting = false;
      s.streak = 0;
      deltas.push(`😴 ${s.name} 休息了一天（疲劳 -35，心情 +8）`);
      return;
    }
    if (!workedLeads.has(s.id)) s.streak = 0;   // 歇一天就清零
    const busy = G.workers.filter(w => w.aiId === s.id && w.busy).length;
    if (workedLeads.has(s.id)) {
      // 亲自上阵：疲劳/心情已在结算时按连击算过，这里不再叠加
    } else if (busy) {
      s.fatigue = clamp(s.fatigue + 7);
      s.mood = clamp(s.mood - 2);
    } else {
      s.mood = clamp(s.mood + 2);
      s.fatigue = clamp(s.fatigue - 4);
    }
    s.mood = clamp(s.mood - 1.5);
    if (s.coffeeDebt) {                        // 咖啡后遗症：次日反噬
      s.fatigue = clamp(s.fatigue + s.coffeeDebt);
      s.mood = clamp(s.mood - 1);
      s.coffeeDebt = 0;
    }
    if (s.fatigue > 75) s.mood = clamp(s.mood - 5);
    s.talkCd = Math.max(0, s.talkCd - 1);
    s.raiseCd = Math.max(0, s.raiseCd - 1);
  });

  // 5. 订单倒计时 / 超时
  G.orders.forEach(o => { o.daysLeft--; });
  const expired = G.orders.filter(o => o.daysLeft <= 0);
  expired.forEach(o => {
    if (!o.crew.length) return;   // 没接的单直接过期，不罚款（玩家可以主动放弃）
    G.cash -= o.penalty;
    G.reputation = clamp(G.reputation - 3);
    o.crew.forEach(wid => {
      if (typeof wid === "string" && wid.indexOf("ai:") === 0) {
        const ai = G.staff.find(s => s.id === wid.slice(3));
        if (ai) ai.working = null;
        return;
      }
      const w = G.workers.find(x => x.id === wid);
      if (w) w.busy = null;
    });
    log(`❌ ${o.title} 超时，违约金 ¥${o.penalty}`);
    deltas.push(`❌ <b>${o.title}</b> 超时 <span style="color:#ff6b6b">-¥${o.penalty}</span>`);
  });
  G.orders = G.orders.filter(o => o.daysLeft > 0);

  // 6. 固定开销
  const aiWages = G.staff.reduce((a, s) => a + s.wage, 0);
  const workerWages = G.workers.reduce((a, w) => a + w.wage, 0);
  const wages = aiWages + workerWages;
  G.cash -= wages + CFG.rentPerDay;
  log(`💸 发薪 ¥${wages}（AI ${aiWages} + 员工 ${workerWages}）+ 房租 ¥${CFG.rentPerDay}`);
  deltas.push(`💸 发薪 <span style="color:#ff9b9b">-¥${wages}</span> · 房租 <span style="color:#ff9b9b">-¥${CFG.rentPerDay}</span>`);

  // 第一次超载：跟玩家解释清楚算法
  if (ov.fee > 0 && !G.seenOverloadTip) {
    G.seenOverloadTip = true;
    setTimeout(() => showOverloadHelp(ov), 700);
  }

  // 算力超载费
  if (ov.fee > 0) {
    G.cash -= ov.fee;
    deltas.push(`⚡ 超频运行（超出 ${ov.over} 点，产出 +${Math.round(ov.bonus * 100)}%）`);
    deltas.push(`💸 超载费 <span style="color:#ff9b9b">-¥${ov.fee}</span>`);
    log(`⚡ 超载 ${ov.over} 点：产出 +${Math.round(ov.bonus * 100)}%，扣 ¥${ov.fee}`);
  }

  // 7. 算力恢复
  G.usedToday = 0;   // 新的一天，免费额度重置
  const cmpBefore = G.compute;
  G.compute = Math.min(CFG.maxCompute, G.compute + CFG.computePerDay);
  if (G.compute > cmpBefore) log(`⚡ 算力恢复 +${G.compute - cmpBefore}`);

  // 8. 士气
  const avgMood = G.staff.reduce((a, s) => a + s.mood, 0) / G.staff.length;
  G.morale = clamp(G.morale + (avgMood - 55) * 0.25);

  // 9. 投资人（每 7 天）
  if (G.day % 7 === 0) {
    if (G.cash > 8000 && G.reputation > 60) { G.investor = clamp(G.investor + 8); log("🏦 投资人满意，信心 +8"); }
    else if (G.cash < 1500) { G.investor = clamp(G.investor - 10); log("🏦 投资人不满，信心 -10"); }
  }

  // 10. 随机事件
  if (Math.random() < 0.35) {
    const e = pick(CFG.events);
    const extra = e.fx(G) || "";
    showModal(e.name, e.desc + (extra ? `<br><b>${extra}</b>` : ""));
    log(`🎲 事件：${e.name}`);
    deltas.push(`🎲 事件：<b>${e.name}</b>`);
  }

  // 11. 新订单
  for (let i = 0; i < ordersPerDay(G.day); i++) spawnOrder();

  // 12. 推进
  G.lastAssign = null;
  const typesBefore = unlockedTypes(G.day);
  G.day++;
  const typesAfter = unlockedTypes(G.day);
  const newTypes = typesAfter.filter(t => typesBefore.indexOf(t) < 0);
  if (newTypes.length) {
    const names = newTypes.map(t => CFG.types[t].name).join("、");
    log(`🔓 新订单类型解锁：${names}`);
    deltas.push(`🔓 新订单类型解锁：<b>${names}</b>`);
  }
  // 记录这一天的历史（截断 deltas 里的 HTML，只留纯文本摘要）
  const plain = deltas.map(x => String(x).replace(/<[^>]+>/g, "")).filter(Boolean);
  G.history = G.history || [];
  G.history.push({
    day: G.day - 1,
    cash: Math.round(G.cash),
    compute: Math.round(G.compute),
    rep: Math.round(G.reputation),
    morale: Math.round(G.morale),
    investor: Math.round(G.investor),
    workers: G.workers.length,
    deltas: plain,
  });
  if (G.history.length > 60) G.history = G.history.slice(-60);

  checkEnd();
  if (!G.finished) showDayTransition(G.day, deltas);
  G.peakCash = Math.max(G.peakCash || 0, G.cash);
  guideAdvance("dayEnded");
  save();
  renderAll();
}

function checkEnd() {
  let ending = null;
  if (G.cash < 0) ending = { t: "破产了", d: "资金链断裂，公司清算。你保住了员工的最后一个月工资，但公司没了。" };
  else if (G.staff.every(s => s.mood < 25)) ending = { t: "集体离职", d: "全员心情崩盘，核心团队一夜之间走光。" };
  else if (G.reputation < 15) ending = { t: "口碑崩盘", d: "差评刷屏，再也没有客户上门。" };
  else if (G.day > CFG.days) {
    const avg = G.staff.reduce((a, s) => a + s.mood, 0) / G.staff.length;
    if (G.investor > 70 && avg > 70) ending = { t: "人性化乌托邦", d: "公司赚钱，员工开心。你证明了：不压榨也能活得好。" };
    else if (G.cash > 15000) ending = { t: "行业龙头", d: "你成了行业第一，代价是所有人都累得说不出话。" };
    else if (avg < 40) ending = { t: "黑心公司", d: "利润漂亮，员工麻木。有人把你的公司写成了反面教材。" };
    else ending = { t: "平稳收官", d: "不惊艳，但活下来了。这行本来就不容易。" };
  }
  if (ending) {
    G.finished = true;
    showModal("结局：" + ending.t, ending.d + `<br><br>第 ${G.day - 1} 天 · 资金 ¥${G.cash} · 口碑 ${G.reputation} · 士气 ${G.morale}`,
      [{ label: "重开一局", fn: () => { newGame(); } }]);
  }
}

const SAVE_KEY = "aicompany_v3";   // 结构变了就升版，旧存档自动作废
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) {} }
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    G = JSON.parse(raw);
    // 结构校验：老版本存档没有 workers / crew，直接作废，避免渲染崩溃
    if (!G || !Array.isArray(G.staff) || !Array.isArray(G.orders) || !Array.isArray(G.workers)) return false;
    if (G.staff.length !== CFG.staff.length || G.workers.length === 0) return false;
    if (!G.orders.every(o => Array.isArray(o.crew))) return false;
    if (typeof G.peakCash !== "number") G.peakCash = Math.max(G.cash || 0, CFG.startCash);
    if (!Array.isArray(G.bag)) G.bag = [];
    if (!Array.isArray(G.history)) G.history = [];
    if (!G.bought || typeof G.bought !== "object") G.bought = {};
    // 旧存档迁移：初始下属技能压到 2~3（招募来的按档次保留）
    let migrated = false;
    (G.workers || []).forEach(w => {
      if (w.tier) return;
      Object.keys(w.skills || {}).forEach(k => {
        if (w.skills[k] > 3) { w.skills[k] = 3; migrated = true; }
        if (w.skills[k] < 2) { w.skills[k] = 2; migrated = true; }
      });
    });
    if (migrated) { try { save(); } catch (e) {} }
    return true;
  } catch (e) { return false; }
}

/* =========================================================
   招聘与转卖
   ========================================================= */
function peakCash() {
  return Math.max(G.peakCash || 0, G.cash || 0);
}

function tierUnlocked(t) {
  return peakCash() >= t.needPeak;
}

function makeWorker(ai, tier) {
  const sk = {};
  const bestType = Object.keys(ai.skills).sort((a, b) => ai.skills[b] - ai.skills[a])[0];
  const lucky = Math.random() < 0.1;   // 每个新人 10% 的概率触发专精加成
  Object.keys(CFG.types).forEach(k => {
    let v = rnd(tier.lo, tier.hi);
    // 专精加成：这个 AI 最拿手的领域再 +1（普通档不加）
    if (k === bestType && tier.id !== "junior" && lucky) v = Math.min(5, v + 1);
    sk[k] = Math.max(1, Math.min(5, v));
  });



  const idx = G.workers.filter(w => w.aiId === ai.id).length + 1;
  return {
    id: ai.id + "-" + idx + "-" + Date.now().toString().slice(-4),
    aiId: ai.id,
    name: ai.name + "·" + idx,
    skills: sk,
    stamina: rnd(80, 100),
    busy: null,
    wage: CFG.workerWage,
    tier: tier.id,
  };
}

function recruit(tierId, aiId) {
  const tier = CFG.recruitTiers.find(t => t.id === tierId);
  const ai = G.staff.find(s => s.id === aiId);
  if (!tier || !ai) return;
  if (!tierUnlocked(tier)) {
    toast(`需要历史最高资金达到 ¥${tier.needPeak} 才能招「${tier.name}」（当前最高 ¥${Math.round(peakCash())}）`, "bad");
    return;
  }
  if (G.cash < tier.cost) {
    toast(`资金不足：招一个「${tier.name}」要 ¥${tier.cost}，当前 ¥${Math.round(G.cash)}，还差 ¥${Math.round(tier.cost - G.cash)}`, "bad");
    return;
  }
  G.cash -= tier.cost;
  const w = makeWorker(ai, tier);
  G.workers.push(w);
  log(`🎓 ${ai.name} 招到 ${w.name}（${tier.name}）`);
  toast(`招到 ${w.name}（${tier.name}），日薪 ¥${w.wage}`, "");
  save();
  renderAll();
}

/* 当天的算力超载情况 */
function overloadInfo() {
  const used = G.usedToday || 0;
  const over = Math.max(0, used - CFG.freeCompute);
  const fee = over > 0 ? Math.round(CFG.overFeeBase * Math.pow(over, CFG.overFeeExp)) : 0;
  const bonus = Math.min(CFG.overBonusMax, CFG.overBonusPerPt * over);
  return { used, over, fee, bonus };
}

/* 卖价：基础 300 + 技能总和×50；
   但招募来的人最多只能卖回当初招募价的 85%（防止"招→卖"刷钱） */
/* 这单是哪些组在做（可能不止一个组） */
function crewGroups(o) {
  const set = new Set();
  (o.crew || []).forEach(id => {
    if (typeof id === "string" && id.indexOf("ai:") === 0) { set.add(id.slice(3)); return; }
    const w = G.workers.find(x => x.id === id);
    if (w) set.add(w.aiId);
  });
  return [...set];
}

function sellPrice(w) {
  let p = CFG.sellBase + Object.values(w.skills).reduce((a, b) => a + b, 0) * 50;
  if (w.paid) p = Math.min(p, Math.round(w.paid * 0.85));
  return p;
}

function sellWorker(workerId) {
  const w = G.workers.find(x => x.id === workerId);
  if (!w) return;
  if (w.busy) { toast(`${w.name} 手上有活，先撤回再卖`, "warn"); return; }
  const ai = G.staff.find(s => s.id === w.aiId);
  const sum = Object.values(w.skills).reduce((a, b) => a + b, 0);
  const price = sellPrice(w);
  showConfirm(
    `卖掉 ${w.name}？`,
    `${w.name} 属于 ${ai ? ai.name : "某组"}，技能总和 ${sum}。<br><br>` +
    `可得 <b style="color:#ffc861">¥${price}</b>，之后每天少付 ¥${w.wage} 工资。<br>` +
    `<span style="color:#8ea3c9;font-size:12px">卖掉就找不回来了。</span>`,
    () => {
      G.cash += price;
      G.peakCash = Math.max(G.peakCash || 0, G.cash);
      G.workers = G.workers.filter(x => x.id !== workerId);
      log(`💸 卖掉 ${w.name}，+¥${price}`);
      toast(`已卖掉 ${w.name}，+¥${price}`, "");
      save();
      renderAll();
    },
    "卖掉"
  );
}

/* 手机端：拖动底部面板的把手来调整高度 */
let sheetH = 0;          // 当前高度(px)，0 = 跟随 CSS 默认
function initSheetDrag() {
  if (typeof document.querySelector !== "function") return;
  const h = $("sheetHandle");
  if (!h) return;
  const main = document.querySelector("main");
  if (!main) return;

  let startY = 0, startH = 0, dragging = false, moved = 0;

  const curH = () => {
    const col = document.querySelector(".col.right");
    return col ? col.getBoundingClientRect().height : 0;
  };
  const setH = (px) => {
    const vh = window.innerHeight;
    const minH = vh * 0.10, maxH = vh * 0.78;
    const v = Math.max(minH, Math.min(maxH, px));
    sheetH = v;
    main.style.setProperty("--rh", v + "px");
  };

  const down = (e) => {
    dragging = true; moved = 0;
    startY = (e.touches ? e.touches[0].clientY : e.clientY);
    startH = curH();
    if (h.setPointerCapture && e.pointerId !== undefined) {
      try { h.setPointerCapture(e.pointerId); } catch (err) {}
    }
  };
  const move = (e) => {
    if (!dragging) return;
    const y = (e.touches ? e.touches[0].clientY : e.clientY);
    const dy = startY - y;          // 往上拖为正
    moved = Math.max(moved, Math.abs(dy));
    if (moved > 3) { e.preventDefault(); }
    setH(startH + dy);
  };
  const up = () => {
    if (!dragging) return;
    dragging = false;
    if (moved < 6) {
      // 没怎么动 = 点一下：在收起/展开之间切换
      const vh = window.innerHeight;
      const now = curH();
      setH(now < vh * 0.42 ? vh * 0.70 : vh * 0.18);
    }
    try { localStorage.setItem("aicompany_sheet_h", String(sheetH || 0)); } catch (err) {}
  };

  h.addEventListener("mousedown", down);
  h.addEventListener("touchstart", down, { passive: true });
  window.addEventListener("mousemove", move);
  window.addEventListener("touchmove", move, { passive: false });
  window.addEventListener("mouseup", up);
  window.addEventListener("touchend", up);

  // 恢复上次拖到的高度
  try {
    const saved = Number(localStorage.getItem("aicompany_sheet_h") || 0);
    if (saved > 60) setH(saved);
  } catch (err) {}
}

function supCost() { return Math.round(ITEMS.sup.base * Math.pow(ITEMS.sup.growth, G.bought.sup || 0)); }
function brkCost() { return Math.round(12000 * Math.pow(1.5, G.bought.brk || 0)); }

function bagOf(id) { const e = (G.bag || []).find(x => x.id === id); return e ? e.n : 0; }
function addBag(id, cnt) {
  G.bag = G.bag || [];
  const e = G.bag.find(x => x.id === id);
  if (e) e.n += (cnt || 1); else G.bag.push({ id: id, n: cnt || 1 });
}
function takeBag(id) {
  const e = (G.bag || []).find(x => x.id === id);
  if (!e || e.n <= 0) return false;
  e.n -= 1;
  G.bag = G.bag.filter(x => x.n > 0);
  return true;
}

/* 有 3 个以上顶尖员工的部门 → 可自主研发 */
function brkTeams() {
  return G.staff.filter(s => G.workers.filter(w => w.aiId === s.id && workerTier(w) === "elite").length >= 3);
}

function buyItem(id) {
  const it = ITEMS[id];
  if (!it) return;
  let cost = 0;
  if (id === "sup") cost = supCost();
  else if (id === "brk") cost = brkCost();
  else cost = it.cost;
  if (G.cash < cost) { toast(`资金不足：要 ¥${cost}，当前 ¥${Math.round(G.cash)}`, "bad"); return; }
  showConfirm(
    `买一张「${it.name}」？`,
    `${it.desc}<br>花费 <b style="color:#ffc861">¥${cost}</b>，买完剩 <b>¥${Math.round(G.cash - cost)}</b>。<br>` +
    `<span style="color:#8ea3c9;font-size:12px">买到的道具会放进背包，用的时候再选人。</span>`,
    () => doBuy(id, cost),
    `买下 ¥${cost}`
  );
}

function doBuy(id, cost) {
  if (G.cash < cost) { toast(`资金不足：要 ¥${cost}，当前 ¥${Math.round(G.cash)}`, "bad"); return; }
  const it = ITEMS[id];
  G.cash -= cost;
  G.bought[id] = (G.bought[id] || 0) + 1;
  addBag(id, 1);
  log(`🛒 买了「${it.name}」（¥${cost}）`);
  toast(`买到「${it.name}」，已放进背包`, "");
  save(); renderHR();
}

function renderShop() {
  const sup = $("shopSup");
  if (sup) {
    const cost = supCost();
    sup.innerHTML = `<div class="icard" onclick="buyItem('sup')">
      <div class="ic-icon">${ITEMS.sup.icon}</div>
      <div class="ic-main">
        <div class="ic-name" style="color:${ITEMS.sup.color}">${ITEMS.sup.name}</div>
        <div class="ic-desc">${ITEMS.sup.desc}</div>

      </div>
      <div class="ic-price ${G.cash >= cost ? "" : "cant"}">¥${cost}</div>
    </div>`;
  }
  const wk = $("shopWorker");
  if (wk) {
    wk.innerHTML = ["jr", "sr", "el"].map(id => {
      const it = ITEMS[id];
      const afford = G.cash >= it.cost;
      return `<div class="icard" onclick="buyItem('${id}')">
        <div class="ic-icon">${it.icon}</div>
        <div class="ic-main">
          <div class="ic-name" style="color:${it.color}">${it.name}</div>
          <div class="ic-desc">${it.desc}</div>
        </div>
        <div class="ic-price ${afford ? "" : "cant"}">¥${it.cost}</div>
      </div>`;
    }).join("");
  }
  const teams = brkTeams();
  const sec = $("shopBrkSec"), box = $("shopBrk");
  if (sec) sec.style.display = teams.length ? "" : "none";
  if (box) {
    box.innerHTML = teams.map(s => {
      const cost = brkCost();
      return `<div class="icard" onclick="buyItem('brk')">
        <div class="ic-icon">${ITEMS.brk.icon}</div>
        <div class="ic-main">
          <div class="ic-name" style="color:${ITEMS.brk.color}">${s.name} 组 · 自主研发</div>
          <div class="ic-desc">${s.name} 旗下有 ${G.workers.filter(w => w.aiId === s.id && workerTier(w) === "elite").length} 名顶尖员工</div>
          <div class="ic-desc">产出 1 张「突破券」，已研发 ${G.bought.brk || 0} 张</div>
        </div>
        <div class="ic-price ${G.cash >= cost ? "" : "cant"}">¥${cost}</div>
      </div>`;
    }).join("");
  }
}

function renderBag() {
  const box = $("bagList");
  if (!box) return;
  const items = (G.bag || []).filter(x => x.n > 0);
  if (!items.length) {
    box.innerHTML = `<div class="bag-empty">背包是空的，去「商店」看看</div>`;
    return;
  }
  box.innerHTML = items.map(e => {
    const it = ITEMS[e.id];
    if (!it) return "";
    return `<div class="icard" onclick="useItem('${e.id}')">
      <div class="ic-icon">${it.icon}</div>
      <div class="ic-main">
        <div class="ic-name" style="color:${it.color}">${it.name} <span class="ic-n">×${e.n}</span></div>
        <div class="ic-desc">${it.desc}</div>
      </div>
      <div class="ic-price use">使用</div>
    </div>`;
  }).join("");
}

/* --- 使用道具：先选人，再选技能 --- */
function useItem(id) {
  const it = ITEMS[id];
  if (!it || bagOf(id) <= 0) return;
  let list = [];
  if (it.kind === "sup" || it.kind === "any") {
    list = list.concat(G.staff.map(s => ({ kind: "staff", obj: s, label: s.name + "（主管）", sub: "上限 " + supCap() })));
  }
  if (it.kind === "worker") {
    list = G.workers.filter(w => workerTier(w) === it.tier)
      .map(w => ({ kind: "worker", obj: w, label: w.name, sub: "上限 " + it.cap }));
  } else if (it.kind === "any") {
    list = list.concat(G.workers.map(w => ({ kind: "worker", obj: w, label: w.name, sub: "上限 8" })));
  }
  if (!list.length) { toast("没有可以对应用的人（先去招人）", "warn"); return; }
  const html = `<div class="picklist">` + list.map(t =>
    `<button class="pickrow" onclick="pickItemSkill('${id}', '${t.kind}', '${t.obj.id}')">${t.label} <em>${t.sub}</em></button>`
  ).join("") + `</div>`;
  showModal(`${it.icon} ${it.name} · 给谁用？`, html, [{ label: "取消", fn: null }]);
}

function pickItemSkill(id, kind, targetId) {
  const it = ITEMS[id];
  const obj = kind === "staff" ? G.staff.find(s => s.id === targetId) : G.workers.find(w => w.id === targetId);
  if (!obj) return;
  const capNow = kind === "staff" ? supCap() : (it.kind === "any" ? 8 : it.cap);
  const html = `<div class="picklist">` + Object.keys(CFG.types).map(k => {
    const cur = obj.skills[k] || 0;
    const full = cur >= capNow;
    return `<button class="pickrow${full ? " cant" : ""}" onclick="${full ? "" : `applyItem('${id}', '${kind}', '${targetId}', '${k}')`}">` +
      `${CFG.types[k].name} <em>${cur} / ${capNow}${full ? " 已满" : ""}</em></button>`;
  }).join("") + `</div>`;
  showModal(`${it.icon} ${it.name} · ${obj.name}`, html, [{ label: "取消", fn: null }]);
}

function applyItem(id, kind, targetId, k) {
  const it = ITEMS[id];
  const capNow = kind === "staff" ? supCap() : (it.kind === "any" ? 8 : it.cap);
  const obj = kind === "staff" ? G.staff.find(s => s.id === targetId) : G.workers.find(w => w.id === targetId);
  if (!obj) return;
  const cur = obj.skills[k] || 0;
  if (cur >= capNow) { toast("这项已经到上限了", "warn"); return; }
  showConfirm(
    `用「${it.name}」？`,
    `${obj.name} 的 <b>${CFG.types[k].name}</b> 从 <b>${cur}</b> 提升到 <b style="color:#59d98c">${cur + 1}</b>（上限 ${capNow}）<br>` +
    `<span style="color:#8ea3c9;font-size:12px">道具用掉就没了，选错不能退回。</span>`,
    () => doApplyItem(id, obj, k),
    "确定使用"
  );
}

function doApplyItem(id, obj, k) {
  if (!takeBag(id)) { toast("背包里没有这个道具了", "bad"); return; }
  obj.skills[k] = (obj.skills[k] || 0) + 1;
  log(`✨ ${obj.name} 的「${CFG.types[k].name}」提升到 ${obj.skills[k]}`);
  toast(`${obj.name} 的${CFG.types[k].name} +1 → ${obj.skills[k]}`, "");
  $("modal").classList.remove("on");
  save(); renderAll(); renderHR();
}

function renderHR() {
  const stat = $("hrStat");
  if (stat) stat.innerHTML = `当前资金 <b>¥${Math.round(G.cash)}</b> · 历史最高 <b>¥${Math.round(peakCash())}</b>`;

  const tiers = $("rpTiers");
  if (tiers) {
    tiers.innerHTML = CFG.recruitTiers.map(t => {
      const ok = tierUnlocked(t);
      const afford = G.cash >= t.cost;
      const sel = pickTier === t.id ? " sel" : "";
      const lock = ok ? (afford ? "" : " cant") : " locked";
      return `<div class="rtier${sel}${lock}" onclick="${ok ? `selectTier('${t.id}')` : `toast('需要历史最高 ¥${t.needPeak} 才解锁「${t.name}」','bad')`}">
        <div class="rt-name" style="color:${t.color}">${t.name}</div>
        <div class="rt-cost">¥${t.cost}</div>
        <div class="rt-skill">技能 ${t.lo}-${t.hi}</div>
        <div class="rt-req">${ok ? "已解锁" : "需历史最高 ¥" + t.needPeak}</div>
      </div>`;
    }).join("");
  }

  const depts = $("rpDepts");
  if (depts) {
    const t = CFG.recruitTiers.find(x => x.id === pickTier);
    depts.innerHTML = G.staff.map(ai => {
      const cnt = G.workers.filter(w => w.aiId === ai.id).length;
      const busy = G.workers.filter(w => w.aiId === ai.id && w.busy).length;
      const can = t && tierUnlocked(t) && G.cash >= t.cost;
      return `<div class="rdept${can ? " can" : ""}" onclick="${can ? `hireTo('${ai.id}')` : `toast('${t ? "资金不够或档次未解锁" : "先在上面选一个档次"}','warn')`}">
        <img src="${ai.portrait}" alt="">
        <div class="rd-name">${ai.name}</div>
        <div class="rd-cnt">${cnt} 人${busy ? " · " + busy + " 在忙" : ""}</div>
      </div>`;
    }).join("");
  }

  const foot = $("rpFoot");
  if (foot) {
    const t = CFG.recruitTiers.find(x => x.id === pickTier);
    foot.innerHTML = t
      ? `已选 <b style="color:${t.color}">${t.name}</b>（¥${t.cost}，技能 ${t.lo}-${t.hi}）— 点上面的部门把人招进去`
      : `先选一个档次，再点部门把人招进去。招募会立即扣钱，新员工从明天开始算工资。`;
  }
  renderShop();


  const list = $("staffList");
  if (list) {
    list.innerHTML = G.staff.map(ai => {
      const team = G.workers.filter(w => w.aiId === ai.id);
      const rows = team.map((w, i) => {
        const st = Math.round(w.stamina);
        const jo = w.busy ? G.orders.find(o => o.id === w.busy) : null;
        const price = sellPrice(w);
        const sk = Object.keys(w.skills).map(k =>
          `<span class="skchip">${CFG.types[k].name}<b>${w.skills[k]}</b></span>`).join("");
        return `<div class="srowwrap">
          <div class="srow">
            <span class="sidx">${i + 1}</span>
            <span class="sname">${w.name}</span>
            <span class="wbar"><i style="width:${st}%"></i></span>
            <span class="sstate">${w.mustRest ? "😵 强制休息" : (jo ? "在做「" + jo.title + "」" : "空闲")}</span>
            <span class="sprice">¥${price}</span>
            <button class="sbtn coffee" onclick="coffeeWorker('${w.id}')" ${st >= 100 ? "disabled" : ""}>☕</button>
            <button class="sbtn" onclick="sellWorker('${w.id}')" ${w.busy ? "disabled" : ""}>卖掉</button>
          </div>
          <div class="sskills">${sk}</div>
        </div>`;
      }).join("");
      return `<div class="scard">
        <div class="scard-h"><img src="${ai.portrait}" alt=""><b>${ai.name}</b><span>${team.length} 人</span></div>
        ${rows || '<div class="sempty">这个部门还没人</div>'}
      </div>`;
    }).join("");
  }
}

function selectTier(id) {
  pickTier = (pickTier === id) ? null : id;
  renderHR();
}

function hireTo(aiId) {
  const t = CFG.recruitTiers.find(x => x.id === pickTier);
  const ai = G.staff.find(s => s.id === aiId);
  if (!t || !ai) return;
  if (!tierUnlocked(t)) { toast(`「${t.name}」还没解锁`, "bad"); return; }
  if (G.cash < t.cost) { toast(`资金不足：要 ¥${t.cost}，当前 ¥${Math.round(G.cash)}`, "bad"); return; }

  const cnt = G.workers.filter(w => w.aiId === ai.id).length;
  const after = Math.round(G.cash - t.cost);
  showConfirm(
    `确定招募到 ${ai.name} 旗下？`,
    `档次：<b style="color:${t.color}">${t.name}</b>（技能 ${t.lo}-${t.hi}）<br>` +
    `花费 <b style="color:#ffc861">¥${t.cost}</b>，完成后剩余 <b>¥${after}</b>。<br>` +
    `<span style="color:#8ea3c9;font-size:12px">${ai.name} 现有 ${cnt} 人 → ${cnt + 1} 人，每天多付 ¥${CFG.workerWage} 工资。</span>`,
    () => doHire(aiId, t, ai),
    `确定招到 ${ai.name}`
  );
}

function doHire(aiId, t, ai) {
  if (G.cash < t.cost) { toast(`资金不足：要 ¥${t.cost}，当前 ¥${Math.round(G.cash)}`, "bad"); return; }
  G.cash -= t.cost;
  const w = makeWorker(ai, t);
  w.paid = t.cost;          // 记下招募成本，卖价以它为上限
  G.workers.push(w);
  log(`🎓 ${ai.name} 招到 ${w.name}（${t.name}）`);
  toast(`${w.name} 加入 ${ai.name}（${t.name}，日薪 ¥${w.wage}）`, "");
  save();
  renderAll();
  renderHR();
}

/* =========================================================
   存档系统：手动存档位 + 导出/导入文件
   ========================================================= */
function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }

function saveMeta() {
  const d = new Date();
  const p = n => (n < 10 ? "0" + n : "" + n);
  return {
    day: G.day,
    cash: Math.round(G.cash),
    time: (d.getMonth() + 1) + "/" + d.getDate() + " " + p(d.getHours()) + ":" + p(d.getMinutes()),
  };
}

function slotInfo(i) {
  const raw = safeGet("aicompany_slot_" + i);
  if (!raw) return null;
  try {
    const o = JSON.parse(raw);
    return o && o.meta ? o.meta : null;
  } catch (e) { return null; }
}

/* 点一下就存（给不熟悉存档位的朋友用） */
function quickSave() {
  save();                                   // 写进自动存档
  const ok = safeSet("aicompany_quick", JSON.stringify({ meta: saveMeta(), g: G }));
  const b = $("btnQuickSave");
  if (b) {
    b.classList.add("saved");
    b.textContent = "✓ 已保存";
    clearTimeout(b._t);
    b._t = setTimeout(() => { b.classList.remove("saved"); b.textContent = "💾 保存"; }, 1500);
  }
  toast(ok ? `已保存 · 第 ${G.day} 天，下次打开接着玩` : "保存失败：浏览器存储不可用", ok ? "" : "bad");
}

function openSavePanel() {
  const rows = [1, 2, 3].map(i => {
    const m = slotInfo(i);
    const desc = m ? `第 ${m.day} 天 · ¥${m.cash} · ${m.time}` : "空";
    return `<div class="slot">
      <div class="si"><b>存档位 ${i}</b><span>${desc}</span></div>
      <div class="sa">
        <button onclick="saveSlot(${i})">保存</button>
        <button onclick="loadSlot(${i})" ${m ? "" : "disabled"}>读取</button>
        <button onclick="delSlot(${i})" ${m ? "" : "disabled"}>删除</button>
      </div>
    </div>`;
  }).join("");

  const auto = safeGet(SAVE_KEY) ? "有" : "无";
  showModal("存档", `
    <div class="slots">${rows}</div>
    <div class="io">
      <button onclick="exportSave()">⬇ 导出存档文件</button>
      <button onclick="importSave()">⬆ 导入存档文件</button>
    </div>
    <p style="font-size:11.5px;color:#8ea3c9;margin-top:12px;line-height:1.7">
      当前进度也会<b>自动存档</b>（${auto}）：关掉浏览器再打开会从上次的位置继续。<br>
      手动存档位可以留三个不同的进度；导出文件能换电脑或备份到别的地方。
    </p>`);
}

function saveSlot(i) {
  const ok = safeSet("aicompany_slot_" + i, JSON.stringify({ meta: saveMeta(), g: G }));
  toast(ok ? `已保存到存档位 ${i}` : "保存失败：浏览器存储不可用", ok ? "" : "bad");
  if (ok) openSavePanel();
}

function loadSlot(i) {
  const raw = safeGet("aicompany_slot_" + i);
  if (!raw) return;
  try {
    const o = JSON.parse(raw);
    if (!o.g || !Array.isArray(o.g.workers)) throw new Error("bad");
    G = o.g;
    save();
    renderAll();
    const el = $("modal");
    if (el) el.classList.remove("on");
    toast(`已读取存档位 ${i}（第 ${G.day} 天）`, "");
  } catch (e) {
    toast("读取失败：存档损坏", "bad");
  }
}

function delSlot(i) {
  showConfirm("删除存档位 " + i + "？", "删了就找不回来了。", () => {
    try { localStorage.removeItem("aicompany_slot_" + i); } catch (e) {}
    openSavePanel();
  }, "删除");
}

function exportSave() {
  try {
    const data = JSON.stringify({ meta: saveMeta(), g: G }, null, 1);
    const blob = new Blob([data], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "AI公司大作战_第" + G.day + "天.json";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1200);
    toast("已导出存档文件", "");
  } catch (e) {
    toast("导出失败：" + e.message, "bad");
  }
}

function importSave() {
  const el = $("importFile");
  if (!el) return;
  el.value = "";
  el.click();
}

function onImportFile(el) {
  const f = el.files && el.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      const g = d.g || d;
      if (!g || !Array.isArray(g.staff) || !Array.isArray(g.workers)) throw new Error("格式不对");
      G = g;
      save();
      renderAll();
      const m = $("modal");
      if (m) m.classList.remove("on");
      toast(`已导入存档（第 ${G.day} 天）`, "");
    } catch (e) {
      toast("导入失败：不是这个游戏的存档文件", "bad");
    }
  };
  r.readAsText(f);
}

  {

      <div class="li"><span class="ic">🎒</span><span>右侧 <b>「背包」</b>：用培训券给员工升技能，用进阶券给主管升技能。</span></div>
      <div class="li"><span class="ic">💎</span><span>某个主管手下凑齐 <b>3 名顶尖员工</b>，就能自主研发「突破券」，突破属性上限。</span></div>

      <div class="li"><span class="ic">💡</span><span>小建议：先让每个人做擅长的事，钱够就升技能，别急着招一堆人——工资是每天扣的。</span></div>`,
