<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>鲸鱼娘 · 桌面养成</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    font-family: "Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    background:
      radial-gradient(1200px 800px at 50% -10%, #2a4d8f 0%, #14253f 45%, #070d18 100%);
    color: #e8f1ff;
    display: flex; align-items: center; justify-content: center;
    padding: 12px; overflow: hidden;
  }
  /* 背景上浮气泡 */
  .bg { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .bg i {
    position: absolute; bottom: -80px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(150,200,255,.30), rgba(120,180,255,.05) 70%);
    animation: rise linear infinite;
  }
  @keyframes rise {
    from { transform: translateY(0) translateX(0); opacity: .9; }
    to   { transform: translateY(-118vh) translateX(var(--dx,0)); opacity: 0; }
  }

  .card {
    position: relative; width: 440px; max-width: 96vw;
    max-height: calc(100vh - 24px);
    display: flex; flex-direction: column;
    border-radius: 24px;
    background: linear-gradient(180deg, rgba(30,54,96,.90), rgba(13,25,44,.96));
    border: 1px solid rgba(130,185,255,.20);
    box-shadow: 0 30px 70px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08);
    overflow: hidden;
  }
  .card::before {   /* 顶部光晕 */
    content: ""; position: absolute; inset: -40% -40% auto -40%; height: 60%;
    background: radial-gradient(closest-side, rgba(120,180,255,.22), transparent);
    pointer-events: none;
  }

  header {
    position: relative; display: flex; justify-content: space-between; align-items: center;
    padding: 13px 18px 6px; font-size: 13px; color: #a9c6ee;
  }
  header .lv { color: #8fc4ff; font-weight: 700; }

  .stage {
    position: relative; flex: 1 1 auto; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 4px 0 8px;
  }
  /* 角色光晕 */
  .stage::after {
    content: ""; position: absolute; width: 300px; height: 300px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(110,175,255,.28), rgba(110,175,255,0) 72%);
    bottom: 6%; pointer-events: none;
  }

  #pet {
    position: relative; z-index: 2;
    height: min(46vh, 300px); width: auto;
    cursor: pointer; user-select: none;
    filter: drop-shadow(0 16px 22px rgba(0,0,0,.45));
    animation: bob 3.1s ease-in-out infinite;
    transform-origin: 50% 92%;
    transition: filter .3s;
  }
  @keyframes bob {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50%     { transform: translateY(-12px) rotate(-1.2deg); }
  }
  #pet.happy { animation: hop .42s ease-in-out 3; }
  @keyframes hop {
    0%,100% { transform: translateY(0) scale(1); }
    40%     { transform: translateY(-26px) scale(1.05,.96); }
    70%     { transform: translateY(0) scale(.96,1.04); }
  }
  #pet.eating { animation: chew .5s ease-in-out 4; }
  @keyframes chew {
    0%,100% { transform: scale(1,1); }
    50%     { transform: scale(1.05,.95) translateY(4px); }
  }
  #pet.sleeping { animation: sleep 4s ease-in-out infinite; filter: brightness(.8) saturate(.7) drop-shadow(0 16px 22px rgba(0,0,0,.45)); }
  @keyframes sleep {
    0%,100% { transform: translateY(0) rotate(-4deg); }
    50%     { transform: translateY(6px) rotate(-6deg); }
  }

  /* 气泡 */
  .bubble {
    position: absolute; left: 50%; top: 2px; transform: translateX(-50%) translateY(6px) scale(.92);
    background: #fff; color: #22303f; font-size: 14.5px; line-height: 1.4;
    padding: 10px 15px; border-radius: 15px; white-space: nowrap;
    box-shadow: 0 10px 26px rgba(0,0,0,.4);
    opacity: 0; transition: opacity .22s, transform .22s; pointer-events: none; z-index: 5;
  }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%);
    border: 7px solid transparent; border-top-color: #fff; border-bottom: 0;
  }
  .bubble.on { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }

  /* 漂浮爱心 */
  .float {
    position: absolute; z-index: 4; font-size: 20px; pointer-events: none;
    animation: floatUp 1.5s ease-out forwards;
  }
  @keyframes floatUp {
    from { opacity: 1; transform: translate(0,0) scale(.6); }
    to   { opacity: 0; transform: translate(var(--fx,0), -110px) scale(1.3); }
  }

  .stats { padding: 0 18px; display: grid; gap: 8px; }
  .row { display: flex; align-items: center; gap: 9px; font-size: 13px; }
  .row .lab { width: 44px; color: #9fb8dc; flex: none; }
  .bar { flex: 1; height: 11px; border-radius: 99px; background: rgba(255,255,255,.08);
         overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,.45); }
  .bar > i { display: block; height: 100%; border-radius: 99px; transition: width .4s ease; }
  .bar.h > i { background: linear-gradient(90deg,#ffc46b,#ff8748); }
  .bar.m > i { background: linear-gradient(90deg,#8ff0b6,#31c477); }
  .bar.e > i { background: linear-gradient(90deg,#9ac8ff,#4a86ff); }
  .row b { width: 30px; text-align: right; color: #b9d0ee; font-weight: 600; flex: none; }

  .acts { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; padding: 14px 16px 16px; }
  button {
    font: inherit; font-size: 13.5px; color: #eaf3ff; cursor: pointer;
    padding: 10px 2px; border-radius: 13px;
    border: 1px solid rgba(130,185,255,.28);
    background: linear-gradient(180deg, rgba(72,124,205,.55), rgba(38,76,142,.55));
    transition: transform .1s, filter .1s, box-shadow .15s;
  }
  button:hover { filter: brightness(1.2); box-shadow: 0 8px 20px rgba(70,130,220,.35); }
  button:active { transform: scale(.93); }
  button.food { border-color: rgba(255,186,110,.5);
    background: linear-gradient(180deg, rgba(255,166,96,.5), rgba(196,108,48,.5)); }
</style>
</head>

    <div class="row"><span class="lab">心情</span><div class="bar m"><i id="bM"></i></div><b id="nM">50</b></div>

    <button class="food" id="btnFeed">🐟 喂食</button>
    <button id="btnPet">🤚 摸摸</button>

    <button id="btnSleep">🌙 睡觉</button>

<script>
const KEY = 'whale_raise_v2';
const st = { hunger: 50, mood: 50, exp: 0, level: 1, sleeping: false, last: Date.now() };

const $ = id => document.getElementById(id);
const pet = $('pet'), bubble = $('bubble');

const LINES = {
  feed: ['啊呜——好吃！', '谢谢投喂～', '还要还要！', '这个鱼干是咸的', '吃饱了才有力气游泳'],
  pet:  ['咕噜咕噜…', '别摸那里啦', '再摸一下也行', '（舒服地眯眼）', '你手心好暖'],
  play: ['来追我呀！', '接住！', '呼呼，好累', '再玩一会儿', '你输了你输了'],
  sleep:['晚安…zzZ', '我先眯一会儿', '（打了个哈欠）', '梦里有大海'],
  hungry: ['肚子…好饿…', '有、有吃的吗', '快喂我嘛'],
  idle: ['……', '今天水面很安静', '你在忙什么？', '我在这儿呢', '（甩了甩尾巴）']
};
const pick = a => a[(Math.random() * a.length) | 0];

let bTimer = null;
function say(t) {
  bubble.textContent = t;
  bubble.classList.add('on');
  clearTimeout(bTimer);
  bTimer = setTimeout(() => bubble.classList.remove('on'), 2600);
}

function clamp(v, lo = 0, hi = 100) { return Math.max(lo, Math.min(hi, v)); }

function anim(cls, ms) {
  pet.classList.remove(cls);
  void pet.offsetWidth;
  pet.classList.add(cls);
  setTimeout(() => pet.classList.remove(cls), ms);
}

function floatEmoji(ch, n = 1) {
  const stage = $('stage');
  const r = stage.getBoundingClientRect();
  for (let i = 0; i < n; i++) {
    const s = document.createElement('div');
    s.className = 'float';
    s.textContent = ch;
    s.style.left = (r.width / 2 + (Math.random() - .5) * 120) + 'px';
    s.style.bottom = (r.height * 0.35 + Math.random() * 40) + 'px';
    s.style.setProperty('--fx', ((Math.random() - .5) * 90) + 'px');
    s.style.animationDelay = (i * 0.08) + 's';
    stage.appendChild(s);
    setTimeout(() => s.remove(), 1800);
  }
}

function gainExp(n) {
  st.exp += n;
  while (st.exp >= 100) {
    st.exp -= 100; st.level++;
    say('升级啦！Lv.' + st.level);
    floatEmoji('✨', 8);
  }
}

function act(kind) {
  if (st.sleeping && kind !== 'sleep') { st.sleeping = false; pet.classList.remove('sleeping'); }
  if (kind === 'feed') {
    if (st.hunger >= 99) { say('吃不下了…'); return; }
    st.hunger = clamp(st.hunger + 18);
    anim('eating', 2000); floatEmoji('🐟', 3); gainExp(6);
    say(pick(LINES.feed));
  } else if (kind === 'pet') {
    st.mood = clamp(st.mood + 8);
    anim('happy', 1300); floatEmoji('💙', 4); gainExp(2);
    say(pick(LINES.pet));
  } else if (kind === 'play') {
    if (st.hunger < 10) { say('饿得没力气玩…'); return; }
    st.hunger = clamp(st.hunger - 7); st.mood = clamp(st.mood + 14);
    anim('happy', 1300); floatEmoji('⭐', 5); gainExp(8);
    say(pick(LINES.play));
  } else if (kind === 'sleep') {
    st.sleeping = true;
    pet.classList.add('sleeping');
    st.mood = clamp(st.mood + 12); gainExp(3);
    say(pick(LINES.sleep));
  }
  save(); render();
}

function render() {
  $('bH').style.width = st.hunger + '%';
  $('bM').style.width = st.mood + '%';
  $('bE').style.width = st.exp + '%';
  $('nH').textContent = Math.round(st.hunger);
  $('nM').textContent = Math.round(st.mood);
  $('nE').textContent = Math.round(st.exp);
  $('lv').textContent = st.level;
}

function save() {
  st.last = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const o = JSON.parse(raw);
    Object.assign(st, o);
    const mins = Math.max(0, (Date.now() - (o.last || Date.now())) / 60000);
    st.hunger = clamp(st.hunger - mins * 0.8);
    st.mood = clamp(st.mood - mins * 0.4);
  } catch (e) {}
}

pet.addEventListener('click', () => act('pet'));
$('btnFeed').onclick = () => act('feed');
$('btnPet').onclick = () => act('pet');
$('btnPlay').onclick = () => act('play');
$('btnSleep').onclick = () => act('sleep');

setInterval(() => {
  const decay = 0.8;
  st.hunger = clamp(st.hunger - decay / 60 * 1.0);
  if (!st.sleeping) st.mood = clamp(st.mood - decay / 60 * 0.45);
  render();
}, 1000);
setInterval(save, 5000);

// 随机说话
setInterval(() => {
  if (Math.random() < 0.35) {
    if (st.hunger < 25) say(pick(LINES.hungry));
    else if (st.sleeping) return;
    else say(pick(LINES.idle));
  }
}, 15000);

// 背景气泡
(function () {
  const box = $('bg');
  for (let i = 0; i < 20; i++) {
    const b = document.createElement('i');
    const s = 6 + Math.random() * 26;
    b.style.width = b.style.height = s + 'px';
    b.style.left = Math.random() * 100 + 'vw';
    b.style.animationDuration = (10 + Math.random() * 14) + 's';
    b.style.animationDelay = (-Math.random() * 24) + 's';
    b.style.setProperty('--dx', (Math.random() * 140 - 70) + 'px');
    box.appendChild(b);
  }
})();

load(); render();
setTimeout(() => say('你回来啦～'), 700);
</script>
</body>
</html>
